<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Wood · Control</title><link rel="stylesheet" href="/style.css"><style>main{max-width:620px}.panel{padding:48px 0}.controls{display:flex;gap:10px;flex-wrap:wrap}.controls button{width:auto}.stat{font-size:1.15rem;line-height:1.8}.admin-input{width:100%;box-sizing:border-box;padding:14px;margin:18px 0;border-radius:8px;border:1px solid #aaa;background:#fff}</style></head><body><main><section class="panel"><p class="eyebrow">private control panel</p><h1>Wood.</h1><p>Enter your admin password to manage the invitation.</p><input id="pw" class="admin-input" type="password" autocomplete="current-password" placeholder="Admin password"><div id="status" class="stat">Not connected.</div><div class="controls"><button data-a="status">Refresh</button><button data-a="allow">Allow another read</button><button data-a="enable">Enable access</button><button data-a="revoke">Revoke now</button><button data-a="reset">Reset counters</button></div></section></main><script>const pw=document.querySelector('#pw'),box=document.querySelector('#status');async function go(action){box.textContent='Working…';const r=await fetch('/.netlify/functions/admin',{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({action,password:pw.value})});const d=await r.json();if(!r.ok){box.textContent='Access denied or service unavailable.';return}const active=d.active&&Date.now()<d.active.expiresAt;box.innerHTML='Status: <b>'+(d.revoked?'Revoked':active?'Reading now':'Ready')+'</b><br>Reads used: '+d.usedReads+' / '+d.allowedReads+(active?'<br>Current window ends: '+new Date(d.active.expiresAt).toLocaleString():'')}document.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.a)));pw.addEventListener('keydown',e=>{if(e.key==='Enter')go('status')});</script></body></html>
