<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Wood · Control</title><link rel="stylesheet" href="/style.css"><style>body{margin:0}.grain,.glow{pointer-events:none}main{width:min(620px,calc(100% - 40px));max-width:620px;margin:0 auto;padding:0}.panel{padding:64px 0}.controls{display:flex;gap:10px;flex-wrap:wrap}.controls button{width:auto}.stat{font-size:1.15rem;line-height:1.8}.admin-input{position:relative;z-index:10;display:block;width:100%;box-sizing:border-box;padding:14px;margin:18px 0;border-radius:8px;border:1px solid #aaa;background:#fff;color:#111;pointer-events:auto;-webkit-user-select:text;user-select:text}textarea.admin-input{min-height:360px;resize:vertical;line-height:1.5}.letter-box{margin-top:42px}.meta{opacity:.8;font-size:.95rem}</style></head><body><main><section class="panel"><p class="eyebrow">private control panel</p><h1>Wood.</h1><p>Enter your admin password to manage the invitation.</p><input id="pw" class="admin-input" type="password" autocomplete="current-password" placeholder="Admin password"><div id="status" class="stat">Not connected.</div><div class="controls"><button data-a="status">Refresh</button><button data-a="allow">Allow another read</button><button data-a="enable">Enable access</button><button data-a="revoke">Revoke now</button><button data-a="reset">Reset counters</button></div><div class="letter-box"><h2>Letter content</h2><p class="meta">Paste the exact letter here. Saving stores it privately in Upstash.</p><textarea id="letter" class="admin-input" placeholder="Paste the full letter here…"></textarea><button id="saveLetter">Save letter</button><p id="letterMeta" class="meta"></p></div></section></main><script>const pw=document.querySelector('#pw'),box=document.querySelector('#status'),letter=document.querySelector('#letter'),letterMeta=document.querySelector('#letterMeta');async function go(action){box.textContent='Working…';const r=await fetch('/.netlify/functions/admin',{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({action,password:pw.value})});const d=await r.json();if(!r.ok){box.textContent='Access denied or service unavailable.';return}const active=d.active&&Date.now()<d.active.expiresAt;letterMeta.textContent=d.letterStored?'Letter stored · '+d.letterCharacters+' characters':'No letter stored yet';box.innerHTML='Status: <b>'+(d.revoked?'Revoked':active?'Reading now':'Ready')+'</b><br>Reads used: '+d.usedReads+' / '+d.allowedReads+(active?'<br>Current reader IP: '+(d.active.ip||'unknown')+'<br>Current window ends: '+new Date(d.active.expiresAt).toLocaleString():'')+(d.lastReader?'<br>Last reader IP: '+d.lastReader.ip:'')+(d.blockedAttempts?'<br>Blocked competing attempts: '+d.blockedAttempts+(d.lastBlocked?' · last IP '+d.lastBlocked.ip:''):'')}document.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.a)));document.querySelector('#saveLetter').addEventListener('click',async()=>{if(!confirm('Save this letter to the private datastore?'))return;letterMeta.textContent='Saving…';const r=await fetch('/.netlify/functions/admin',{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({action:'saveLetter',password:pw.value,letter:letter.value})});const d=await r.json();letterMeta.textContent=r.ok?'Letter stored · '+d.letterCharacters+' characters':'Could not save letter.'});pw.addEventListener('keydown',e=>{if(e.key==='Enter')go('status')});</script></body></html>
